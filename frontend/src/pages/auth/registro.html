<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-brand">
                <img id="logo-img" src="" alt="" style="display:none; height:60px; margin-bottom:16px;">
                <h1 id="nombre-cooperativa"></h1>
                <p>Tu viaje comienza aquí</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-box">
                <h2>Crear cuenta</h2>
                <p class="auth-subtitle">Completa tus datos para registrarte</p>

                <div id="error-msg" class="error-msg" style="display:none"></div>
                <div id="success-msg" class="success-msg" style="display:none"></div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nombres</label>
                        <input type="text" id="nombres" placeholder="Juan">
                    </div>
                    <div class="form-group">
                        <label>Apellidos</label>
                        <input type="text" id="apellidos" placeholder="Pérez">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cédula</label>
                        <input type="text" id="cedula" placeholder="0000000000" maxlength="10">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="telefono" placeholder="0999999999">
                    </div>
                </div>

                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="correo" placeholder="correo@ejemplo.com">
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-password">
                        <input type="password" id="password" placeholder="••••••••">
                        <button type="button" id="togglePassword">👁</button>
                    </div>
                </div>

                <button class="btn-primary" id="btnRegistro">Crear cuenta</button>

                <div class="auth-footer">
                    <a href="/src/pages/auth/login.html">¿Ya tienes cuenta? Inicia sesión</a>
                    <a href="/src/pages/landing/landing.html">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="registro.js"></script>
</body>
</html>

<!DOCTYPE html>

</head>
<body>

            <img id="logo-img" src="" alt="" style="display:none; height:40px;">
            <span id="nombre-cooperativa"></span>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="inicio">
                <span>🏠</span> Inicio
            </a>
            <a href="#" class="nav-item" data-page="cooperativa">
                <span>🏢</span> Cooperativa
            </a>
            <a href="#" class="nav-item" data-page="usuarios">
                <span>👥</span> Usuarios
            </a>
            <a href="#" class="nav-item" data-page="buses">

            </a>

            </a>

            </a>

            </a>
            <a href="#" class="nav-item" data-page="boletos">
                <span>🎫</span> Boletos
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="usuario-info">
                <span id="usuario-nombre"></span>
                <small>Administrador</small>
            </div>
            <button class="btn-logout" id="btnLogout">Salir</button>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="topbar">
            <button class="btn-menu" id="btnMenu">☰</button>
            <h2 id="page-title">Inicio</h2>
        </div>

        <div class="content" id="content">

    <script type="module" src="dashboard.js"></script>
